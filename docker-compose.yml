services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dgtl_cms
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dgtl_cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dgtl-postgres:/var/lib/postgresql/data

volumes:
  dgtl-postgres:
