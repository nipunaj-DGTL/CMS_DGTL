version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /apps/cms
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /apps/website
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /apps/dgtl360
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
