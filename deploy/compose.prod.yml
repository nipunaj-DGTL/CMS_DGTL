name: ${COMPOSE_PROJECT_NAME:-dgtl-platform}

x-app-runtime: &app-runtime
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    app: {}
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m

services:
  cms:
    <<: *app-runtime
    image: ${CMS_WEB_IMAGE:-ghcr.io/example/dgtl-cms-web:replace-with-digest}
    env_file:
      - ${SECRETS_DIR:-./secrets}/cms.env
    environment:
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s

  worker:
    <<: *app-runtime
    image: ${CMS_WORKER_IMAGE:-ghcr.io/example/dgtl-cms-worker:replace-with-digest}
    env_file:
      - ${SECRETS_DIR:-./secrets}/cms.env
    environment:
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      # A cold worker proves readiness only after its first complete queue cycle.
      # Ten deliveries can each consume the bounded 10-second webhook timeout.
      start_period: 150s
      retries: 3
    stop_grace_period: 30s

  migrate:
    image: ${CMS_MIGRATE_IMAGE:-ghcr.io/example/dgtl-cms-migrate:replace-with-digest}
    profiles: ["tools"]
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      app: {}
    env_file:
      - ${SECRETS_DIR:-./secrets}/migration.env
    environment:
      NODE_ENV: production
      PAYLOAD_DB_PUSH: "false"

  client01:
    <<: *app-runtime
    image: ${CLIENT01_IMAGE:-ghcr.io/example/dgtl-client01:replace-with-digest}
    env_file:
      - ${SECRETS_DIR:-./secrets}/client01.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      cms:
        condition: service_healthy
    stop_grace_period: 30s

  dgtl360:
    <<: *app-runtime
    image: ${DGTL360_IMAGE:-ghcr.io/example/dgtl360:replace-with-digest}
    env_file:
      - ${SECRETS_DIR:-./secrets}/dgtl360.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      cms:
        condition: service_healthy
    stop_grace_period: 30s

  # Enable this profile on a plain VPS. A different containerized ingress must
  # join this project's app network and route by service DNS; `expose` never
  # publishes port 3000 on the host.
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@dgtl.lk}
      CLIENT01_HOSTNAME: ${CLIENT01_HOSTNAME:-client01.dgtl.lk}
      CMS_HOSTNAME: ${CMS_HOSTNAME:-cms.dgtl.lk}
      DGTL360_HOSTNAME: ${DGTL360_HOSTNAME:-dgtl.lk}
      DGTL360_WWW_HOSTNAME: ${DGTL360_WWW_HOSTNAME:-www.dgtl.lk}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      app: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
    depends_on:
      cms:
        condition: service_healthy
      client01:
        condition: service_healthy
      dgtl360:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m

networks:
  app:
    driver: bridge

volumes:
  caddy_config:
  caddy_data:
